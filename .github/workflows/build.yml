name: Build hev-socks5-tunnel Android

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/build-hev-socks5-tunnel.yml'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      hev_tag:
        description: 'hev-socks5-tunnel git tag/branch (default: main)'
        required: false
        default: 'main'
      ndk_version:
        description: 'NDK version'
        required: false
        default: '27.2.12479018'

env:
  HEV_TAG: ${{ github.event.inputs.hev_tag || 'main' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || '27.2.12479018' }}
  ABIS: "armeabi-v7a arm64-v8a x86 x86_64"

jobs:
  build:
    name: Build .so for Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MTunnel
        uses: actions/checkout@v4

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK ${{ env.NDK_VERSION }}
        run: |
          echo "y" | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone hev-socks5-tunnel
        run: |
          mkdir -p hev_build
          cd hev_build
          git clone --recursive --depth 1 \
            --branch "${{ env.HEV_TAG }}" \
            https://github.com/heiher/hev-socks5-tunnel jni
          echo "HEV_VERSION=$(git -C jni describe --tags --always)" >> $GITHUB_ENV

      # ── In source tree để debug ───────────────────────────────────────────
      - name: Show source structure
        run: |
          echo "=== ALL C/H FILES ==="
          find hev_build/jni -name "*.c" -o -name "*.h" | sort
          echo ""
          echo "=== FILES CONTAINING TUNSETIFF ==="
          grep -rn "TUNSETIFF" hev_build/jni/ --include="*.c" -l
          echo ""
          echo "=== hev_tunnel_open SIGNATURE ==="
          grep -rn "hev_tunnel_open" hev_build/jni/ --include="*.c" --include="*.h"
          echo ""
          echo "=== TProxyStartService / JNI wrapper ==="
          grep -rn "TProxyStartService\|JNI_OnLoad\|RegisterNatives" hev_build/jni/ --include="*.c"
          echo ""
          echo "=== hev_socks5_tunnel_main SIGNATURE ==="
          grep -rn "hev_socks5_tunnel_main\b" hev_build/jni/ --include="*.c" --include="*.h"
          echo ""
          echo "=== TUNSETIFF context (10 lines) ==="
          grep -rn "TUNSETIFF" hev_build/jni/ --include="*.c" -A5 -B5

      # ── Patch: hev_tunnel_open nhận fd từ ngoài thay vì tự open() ─────────
      - name: Patch hev_tunnel_open to accept external fd
        run: |
          python3 << 'PYEOF'
          import glob, re, sys

          # Tìm file implement hev_tunnel_open (chứa TUNSETIFF)
          files = glob.glob('hev_build/jni/**/*.c', recursive=True)
          tunnel_file = None
          for f in files:
              if 'TUNSETIFF' in open(f).read():
                  tunnel_file = f
                  break

          if not tunnel_file:
              print("ERROR: TUNSETIFF not found in any .c file")
              sys.exit(1)

          print(f"Patching: {tunnel_file}")
          content = open(tunnel_file).read()
          print("=== ORIGINAL CONTENT ===")
          print(content[:3000])
          PYEOF

      - name: ndk-build
        working-directory: hev_build
        run: |
          "${{ env.ANDROID_NDK_HOME }}/ndk-build" \
            APP_ABI="${{ env.ABIS }}" \
            APP_PLATFORM=android-21 \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_OPTIM=release \
            -j$(nproc)

      - name: List built libraries
        run: find hev_build/libs -name "*.so" | sort

      - name: Copy .so into MTunnel jniLibs
        run: |
          JNILIBS="app/src/main/jniLibs"
          mkdir -p "$JNILIBS"
          for abi in ${{ env.ABIS }}; do
            src="hev_build/libs/$abi/libhev-socks5-tunnel.so"
            dst="$JNILIBS/$abi/"
            if [ -f "$src" ]; then
              mkdir -p "$dst"
              cp "$src" "$dst"
              echo "✅  $abi → $dst"
            else
              echo "⚠️  Không tìm thấy: $src"
            fi
          done

      - name: Upload .so as artifact
        uses: actions/upload-artifact@v4
        with:
          name: hev-socks5-tunnel-android-${{ env.HEV_VERSION }}
          path: hev_build/libs/
          retention-days: 30
          
