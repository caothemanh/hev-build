name: Build hev-socks5-tunnel Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      hev_ref:
        description: 'hev branch/tag (default: main)'
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Clone hev vào build/jni/ đúng theo hướng dẫn chính thức
      - name: Clone hev-socks5-tunnel
        run: |
          REF="${{ github.event.inputs.hev_ref || 'main' }}"
          git clone --recursive --depth=1 --branch "$REF" \
            https://github.com/heiher/hev-socks5-tunnel \
            build/jni
          echo "HEV_VERSION=$(git -C build/jni describe --tags --always 2>/dev/null || echo $REF)" >> $GITHUB_ENV
          echo "=== src/ files ===" && ls build/jni/src/
          echo "=== hev-jni.c PKGNAME/CLSNAME ===" && grep -n "PKGNAME\|CLSNAME" build/jni/src/hev-jni.c

      # Patch PKGNAME thành com/v2ray/services trong Android.mk
      # hev-jni.c dùng: STR(PKGNAME) "/" STR(CLSNAME) để tạo class path
      # Cần: "com/v2ray/services/TProxyService"
      - name: Patch PKGNAME in Android.mk
        run: |
          python3 << 'PYEOF'
          with open('build/jni/Android.mk', 'r') as f:
              content = f.read()

          print("=== Original Android.mk ===")
          print(content)

          # Thêm -DPKGNAME=com/v2ray/services vào CFLAGS của hev-socks5-tunnel module
          # Phải thêm TRƯỚC include $(BUILD_SHARED_LIBRARY)
          if 'PKGNAME' not in content:
              content = content.replace(
                  'include $(BUILD_SHARED_LIBRARY)',
                  'LOCAL_CFLAGS += -DPKGNAME=com/v2ray/services\n'
                  'include $(BUILD_SHARED_LIBRARY)'
              )
              print("✅ Patched PKGNAME")
          else:
              # Override PKGNAME đã có
              import re
              content = re.sub(
                  r'-DPKGNAME=\S+',
                  '-DPKGNAME=com/v2ray/services',
                  content
              )
              print("✅ Replaced existing PKGNAME")

          with open('build/jni/Android.mk', 'w') as f:
              f.write(content)

          print("\n=== Patched Android.mk ===")
          print(content)
          PYEOF

      - name: Create Application.mk
        run: |
          cat > build/jni/Application.mk << 'EOF'
          APP_ABI      := arm64-v8a armeabi-v7a x86 x86_64
          APP_PLATFORM := android-21
          APP_STL      := none
          APP_OPTIM    := release
          EOF

      - name: Setup NDK r27c
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - name: ndk-build
        working-directory: build
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_LIBS_OUT=./libs \
            NDK_OUT=./obj \
            -j$(nproc) \
            V=1

      - name: Verify output
        run: |
          echo "=== Built .so files ==="
          find build/libs -name "*.so" -exec ls -lh {} \;

          echo ""
          echo "=== Verify JNI class registration ==="
          # JNI_OnLoad dùng dynamic registration, class path là string
          # hev-jni.c: FindClass(env, STR(PKGNAME) "/" STR(CLSNAME))
          # Sau patch: "com/v2ray/services/TProxyService"
          for so in build/libs/*/libhev-socks5-tunnel.so; do
            echo "--- $so ---"
            strings "$so" | grep -E "TProxy|com/v2ray|hev/htproxy|ang/service"
          done

          echo ""
          echo "=== Verify: no /dev/net/tun (fd passthrough) ==="
          strings build/libs/arm64-v8a/libhev-socks5-tunnel.so | grep "/dev/net/tun" \
            && echo "⚠️  Still opens /dev/net/tun directly" \
            || echo "✅ No /dev/net/tun — uses fd passthrough"

      - name: Package
        run: |
          mkdir -p artifact/jni
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            [ -d "build/libs/$abi" ] && cp -r "build/libs/$abi" "artifact/jni/" && echo "✅ $abi"
          done
          cd artifact && zip -r ../hev-socks5-tunnel-android-${{ env.HEV_VERSION }}.zip jni/
          echo "=== Zip contents ===" && unzip -l ../hev-socks5-tunnel-android-${{ env.HEV_VERSION }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hev-socks5-tunnel-android-${{ env.HEV_VERSION }}
          path: hev-socks5-tunnel-android-${{ env.HEV_VERSION }}.zip
          retention-days: 30
