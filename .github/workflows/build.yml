name: Build hev-socks5-tunnel Android (inject-fd patch)

on:
  workflow_dispatch:
    inputs:
      hev_tag:
        required: false
        default: 'main'
      ndk_version:
        required: false
        default: '27.2.12479018'

env:
  HEV_TAG: ${{ github.event.inputs.hev_tag || 'main' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || '27.2.12479018' }}
  ABIS: "armeabi-v7a arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MTunnel
        uses: actions/checkout@v4

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 \
            --branch "${{ env.HEV_TAG }}" \
            https://github.com/heiher/hev-socks5-tunnel hev_build/jni
          echo "HEV_VERSION=$(git -C hev_build/jni describe --tags --always)" >> $GITHUB_ENV

      - name: Show hev-jni.c and tunnel open file
        run: |
          echo "=== hev-jni.c ==="
          cat hev_build/jni/src/hev-jni.c
          echo ""
          echo "=== File with open()/TUNSETIFF ==="
          TFILE=$(grep -rl "TUNSETIFF\|/dev/tun\|/dev/net/tun" hev_build/jni/src/ --include="*.c" | head -1)
          echo "File: $TFILE"
          cat "$TFILE"

      - name: Apply inject-fd patch
        run: |
          python3 - << 'PYEOF'
          import glob, re, sys

          src = 'hev_build/jni/src'

          # ── Đọc hev-jni.c để biết tên biến fd thực tế ───────────────────
          jni_content = open(f'{src}/hev-jni.c').read()
          print("=== hev-jni.c ===")
          print(jni_content)

          # Tìm tên tham số fd trong TProxyStartService (thường là arg thứ 3 của JNI = jint)
          # Pattern: Java_..._TProxyStartService(JNIEnv *env, jobject obj, jstring cfg, jint tunFd)
          m = re.search(r'TProxyStartService\s*\([^)]+jint\s+(\w+)', jni_content)
          fd_param = m.group(1) if m else None
          print(f"\nFd parameter name: {fd_param}")

          # Tìm call đến hev_socks5_tunnel_main
          m2 = re.search(r'hev_socks5_tunnel_main\w*\s*\([^;]+;', jni_content)
          print(f"Main call: {m2.group(0) if m2 else 'not found'}")

          # ── Tìm file tunnel open ─────────────────────────────────────────
          tun_file = None
          for f in sorted(glob.glob(f'{src}/**/*.c', recursive=True)):
              c = open(f).read()
              if ('TUNSETIFF' in c or '/dev/tun' in c or '/dev/net/tun' in c) and 'open' in c:
                  tun_file = f
                  break
          print(f"\nTunnel file: {tun_file}")
          if tun_file:
              print(open(tun_file).read())

          PYEOF

      - name: Patch files
        run: |
          python3 - << 'PYEOF'
          import glob, re, sys

          src = 'hev_build/jni/src'
          jni_content = open(f'{src}/hev-jni.c').read()

          # Tìm tên biến fd thực tế trong hev-jni.c
          # Pattern 1: jint <name> trong TProxyStartService
          m = re.search(r'TProxyStartService[^{]+jint\s+(\w+)', jni_content, re.DOTALL)
          fd_param = m.group(1) if m else 'tun_fd'
          print(f"fd param name: '{fd_param}'")

          # ── Patch hev-jni.c: thêm g_tun_fd trước main call ──────────────
          # Tìm hev_socks5_tunnel_main call và chèn g_tun_fd = <fd_param>
          if 'g_tun_fd' not in jni_content:
              # Chèn trước bất kỳ call nào đến hev_socks5_tunnel_main*
              jni_content = re.sub(
                  r'(\bhev_socks5_tunnel_main\w*\s*\()',
                  f'extern int g_tun_fd; g_tun_fd = {fd_param}; \\1',
                  jni_content
              )
              open(f'{src}/hev-jni.c', 'w').write(jni_content)
              print("Patched hev-jni.c")
          else:
              print("hev-jni.c already patched")

          # ── Patch tunnel file: thêm g_tun_fd bypass ─────────────────────
          tun_file = None
          for f in sorted(glob.glob(f'{src}/**/*.c', recursive=True)):
              c = open(f).read()
              if ('TUNSETIFF' in c or '/dev/tun' in c) and 'open' in c:
                  tun_file = f
                  break

          if not tun_file:
              print("ERROR: tunnel file not found"); sys.exit(1)

          content = open(tun_file).read()

          # Thêm global declaration
          if 'int g_tun_fd' not in content:
              last_inc = 0
              for mm in re.finditer(r'^#include\s+\S+', content, re.MULTILINE):
                  last_inc = mm.end()
              ins = '\n\nint g_tun_fd = -1;\n'
              content = content[:last_inc] + ins + content[last_inc:]

          # Patch: wrap open() tun call với g_tun_fd check
          # Tìm dòng: fd = open("...tun...) hoặc fd = hev_task_io_open(...)
          lines = content.splitlines(keepends=True)
          new_lines = []
          patched = False
          for line in lines:
              stripped = line.strip()
              # Tìm dòng assign fd từ open() với tun
              if not patched and re.search(r'\bfd\s*=\s*\w*open\s*\(', line) and \
                 ('tun' in line.lower() or 'RDWR' in line):
                  indent = ' ' * (len(line) - len(line.lstrip()))
                  new_lines.append(f'{indent}if (g_tun_fd >= 0) {{\n')
                  new_lines.append(f'{indent}    fd = g_tun_fd;\n')
                  new_lines.append(f'{indent}}} else {{\n')
                  new_lines.append(f'{indent}    {stripped}\n')
                  new_lines.append(f'{indent}}}\n')
                  patched = True
                  print(f"Patched open(): {stripped}")
                  continue
              new_lines.append(line)

          if not patched:
              print("WARN: could not find open() line, trying regex replace")
              content = re.sub(
                  r'(\bfd\s*=\s*\w*open\s*\([^;]+;)',
                  r'if (g_tun_fd >= 0) { fd = g_tun_fd; } else { \1 }',
                  content
              )
          else:
              content = ''.join(new_lines)

          open(tun_file, 'w').write(content)
          print(f"Saved {tun_file}")

          # Show result
          print("\n=== Patched tunnel file (open/g_tun_fd lines) ===")
          for i, line in enumerate(open(tun_file).read().splitlines()):
              if 'g_tun_fd' in line or ('open' in line and 'tun' in line.lower()):
                  print(f"{i+1:4}: {line}")

          print("\n=== Patched hev-jni.c (g_tun_fd lines) ===")
          for i, line in enumerate(open(f'{src}/hev-jni.c').read().splitlines()):
              if 'g_tun_fd' in line or 'hev_socks5_tunnel_main' in line:
                  print(f"{i+1:4}: {line}")
          PYEOF

      - name: ndk-build
        working-directory: hev_build
        run: |
          "${{ env.ANDROID_NDK_HOME }}/ndk-build" \
            APP_ABI="${{ env.ABIS }}" \
            APP_PLATFORM=android-21 \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_OPTIM=release \
            -j$(nproc)

      - name: Verify
        run: |
          echo "=== g_tun_fd symbol exported ==="
          nm -D hev_build/libs/arm64-v8a/libhev-socks5-tunnel.so | grep g_tun_fd || echo "not exported (OK if static)"
          echo "=== dev strings ==="
          strings hev_build/libs/arm64-v8a/libhev-socks5-tunnel.so | grep "dev/"

      - name: Copy .so into MTunnel jniLibs
        run: |
          for abi in ${{ env.ABIS }}; do
            src="hev_build/libs/$abi/libhev-socks5-tunnel.so"
            dst="app/src/main/jniLibs/$abi/"
            if [ -f "$src" ]; then
              mkdir -p "$dst"
              cp "$src" "$dst"
              echo "✅  $abi"
            fi
          done

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hev-inject-fd-${{ env.HEV_VERSION }}
          path: hev_build/libs/
          retention-days: 30
          
