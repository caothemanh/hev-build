name: Build hev-socks5-tunnel Android (patch dev/tun)

on:
  workflow_dispatch:
    inputs:
      hev_tag:
        description: 'hev-socks5-tunnel git tag/branch'
        required: false
        default: 'main'
      ndk_version:
        required: false
        default: '27.2.12479018'

env:
  HEV_TAG: ${{ github.event.inputs.hev_tag || 'main' }}
  NDK_VERSION: ${{ github.event.inputs.ndk_version || '27.2.12479018' }}
  ABIS: "armeabi-v7a arm64-v8a"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MTunnel
        uses: actions/checkout@v4

      - name: Set up Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          echo "y" | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Clone hev-socks5-tunnel
        run: |
          git clone --recursive --depth 1 \
            --branch "${{ env.HEV_TAG }}" \
            https://github.com/heiher/hev-socks5-tunnel hev_build/jni
          echo "HEV_VERSION=$(git -C hev_build/jni describe --tags --always)" >> $GITHUB_ENV

      # ── In source để xác nhận cấu trúc ──────────────────────────────────
      - name: Show source structure
        run: |
          echo "=== C files ==="
          find hev_build/jni/src -name "*.c" | sort
          echo ""
          echo "=== /dev/net/tun references ==="
          grep -rn "dev/net/tun\|dev/tun\|TUNSETIFF" hev_build/jni/src/ --include="*.c"

      # ── PATCH: thay /dev/net/tun → /dev/tun ─────────────────────────────
      # Android dùng /dev/tun (không có thư mục con net/)
      # SELinux policy của untrusted_app cho phép open /dev/tun qua VpnService
      # nhưng hev hardcode /dev/net/tun → fail
      - name: Patch /dev/net/tun → /dev/tun
        run: |
          echo "=== Patching ==="
          # Thay thế trong tất cả .c và .h files
          grep -rln "dev/net/tun" hev_build/jni/src/ | while read f; do
            echo "Patching: $f"
            sed -i 's|/dev/net/tun|/dev/tun|g' "$f"
            # Verify
            grep -n "dev/tun" "$f"
          done

          echo "=== Verify no /dev/net/tun left ==="
          grep -rn "dev/net/tun" hev_build/jni/src/ && echo "STILL FOUND!" || echo "Clean"

      # ── Build ─────────────────────────────────────────────────────────────
      - name: ndk-build
        working-directory: hev_build
        run: |
          "${{ env.ANDROID_NDK_HOME }}/ndk-build" \
            APP_ABI="${{ env.ABIS }}" \
            APP_PLATFORM=android-21 \
            APP_BUILD_SCRIPT=jni/Android.mk \
            APP_OPTIM=release \
            -j$(nproc)

      - name: List built libraries
        run: |
          find hev_build/libs -name "*.so" | sort
          echo "=== arm64-v8a size ==="
          ls -lh hev_build/libs/arm64-v8a/libhev-socks5-tunnel.so 2>/dev/null || true

      - name: Copy .so into MTunnel jniLibs
        run: |
          JNILIBS="app/src/main/jniLibs"
          mkdir -p "$JNILIBS"
          for abi in ${{ env.ABIS }}; do
            src="hev_build/libs/$abi/libhev-socks5-tunnel.so"
            dst="$JNILIBS/$abi/"
            if [ -f "$src" ]; then
              mkdir -p "$dst"
              cp "$src" "$dst"
              echo "✅  $abi → $dst"
            else
              echo "⚠️  Not found: $src"
            fi
          done

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: hev-socks5-tunnel-devtun-patch-${{ env.HEV_VERSION }}
          path: hev_build/libs/
          retention-days: 30
          
